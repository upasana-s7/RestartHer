<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">RestartHER — a woman beginning her next chapter</title>
<desc id="desc">An editorial illustration of a woman in a flowing rose dress with gently animated hair and fabric, holding a book in a dreamy burgundy garden.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7e9ed"/><stop offset=".52" stop-color="#ead6e7"/><stop offset="1" stop-color="#d9c2dc"/></linearGradient>
  <linearGradient id="dress" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d96e83"/><stop offset=".55" stop-color="#b94c69"/><stop offset="1" stop-color="#85344f"/></linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4c2637"/><stop offset=".5" stop-color="#71394b"/><stop offset="1" stop-color="#351c2a"/></linearGradient>
  <linearGradient id="book" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7e8"/><stop offset="1" stop-color="#e7d4bd"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  <style>
    .hair-flow { transform-box: fill-box; transform-origin: 55% 18%; animation: hairWave 4.8s ease-in-out infinite; }
    .hair-strand { transform-box: fill-box; transform-origin: 0% 0%; animation: strandWave 3.8s ease-in-out infinite; }
    .dress-flow { transform-box: fill-box; transform-origin: 50% 0%; animation: fabricSway 5.2s ease-in-out infinite; }
    .skirt-edge { transform-box: fill-box; transform-origin: 50% 0%; animation: hemSway 4.4s ease-in-out infinite; }
    .floating { animation: drift 6s ease-in-out infinite; }
    .floating.delay { animation-delay: -2.8s; }
    @keyframes hairWave { 0%,100%{transform:rotate(-1deg) translateX(0)} 50%{transform:rotate(2.2deg) translateX(5px)} }
    @keyframes strandWave { 0%,100%{transform:rotate(-1deg)} 50%{transform:rotate(3deg)} }
    @keyframes fabricSway { 0%,100%{transform:skewX(-.6deg) translateX(0)} 50%{transform:skewX(1.1deg) translateX(3px)} }
    @keyframes hemSway { 0%,100%{transform:rotate(-.4deg)} 50%{transform:rotate(1.2deg)} }
    @keyframes drift { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @media (prefers-reduced-motion: reduce) { .hair-flow,.hair-strand,.dress-flow,.skirt-edge,.floating { animation:none } }
  </style>
</defs>
<rect width="1000" height="1000" fill="url(#bg)"/>
<circle cx="735" cy="240" r="210" fill="#fff9f1" opacity=".42"/>
<circle cx="270" cy="720" r="260" fill="#c18aaf" opacity=".22" filter="url(#soft)"/>
<path d="M0 770 Q190 690 360 770 T720 750 T1000 780 V1000 H0Z" fill="#9b6c91" opacity=".22"/>
<g opacity=".65" fill="#b88aaa">
  <path class="floating" d="M160 240 q-48 -62 -6 -102 q45 50 6 102 q58 -27 89 20 q-59 31 -89 -20Z"/>
  <path class="floating delay" d="M815 420 q-38 -58 3 -95 q43 48 -3 95 q52 -23 83 18 q-52 31 -83 -18Z"/>
  <path class="floating" d="M175 600 q-35 -52 2 -83 q39 42 -2 83 q47 -20 72 17 q-47 26 -72 -17Z"/>
</g>
<g fill="#fffaf2" opacity=".75">
  <path class="floating" d="M760 130 l7 17 17 7 -17 7 -7 17 -7 -17 -17 -7 17 -7Z"/>
  <path class="floating delay" d="M235 390 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5Z"/>
  <circle cx="840" cy="670" r="4"/><circle cx="150" cy="470" r="3"/><circle cx="690" cy="560" r="3"/>
</g>
<!-- flowing hair behind the figure -->
<g class="hair-flow" fill="url(#hair)">
  <path d="M423 250 C330 300 340 420 365 510 C388 600 340 690 300 760 C390 730 440 660 445 570 C460 460 500 370 480 285Z"/>
  <path d="M555 250 C650 290 680 390 650 500 C620 610 700 680 730 750 C640 720 570 650 565 550 C540 430 510 360 520 285Z"/>
  <path d="M425 235 C380 300 390 405 410 485 C425 560 400 640 365 690 C445 665 480 590 475 500 C470 390 490 300 460 240Z" opacity=".55"/>
</g>
<!-- torso and dress silhouette -->
<path d="M450 330 C420 355 410 405 430 455 L390 555 C355 670 320 800 275 895 Q500 940 725 895 C680 800 645 670 610 555 L570 455 C590 405 580 355 550 330Z" fill="url(#dress)"/>
<g class="dress-flow">
  <path d="M450 350 C425 420 440 490 420 580 C390 700 360 815 320 890 Q430 910 500 900 C470 790 490 690 490 580 C485 480 480 400 500 350Z" fill="#e78c9d" opacity=".5"/>
  <path d="M550 350 C575 420 560 490 580 580 C610 700 640 815 680 890 Q570 910 500 900 C530 790 510 690 510 580 C515 480 520 400 500 350Z" fill="#873a56" opacity=".42"/>
  <path class="skirt-edge" d="M330 820 Q420 790 500 840 Q590 790 670 820 L725 895 Q500 945 275 895Z" fill="#a34261" opacity=".5"/>
  <path d="M490 390 C480 500 510 610 485 740" fill="none" stroke="#f4b4bd" stroke-width="8" opacity=".25"/>
</g>
<!-- neck and face -->
<path d="M465 300 L465 360 Q500 390 535 360 L535 300Z" fill="#d9a28f"/>
<ellipse cx="500" cy="245" rx="92" ry="112" fill="#e5b6a1"/>
<path d="M414 255 Q410 170 500 155 Q590 170 586 255 Q575 170 500 180 Q430 180 414 255Z" fill="#4b2637"/>
<path d="M454 248 q15 -10 28 0 M518 248 q15 -10 28 0" stroke="#63384a" stroke-width="5" stroke-linecap="round" fill="none"/>
<path d="M492 282 q8 6 16 0" stroke="#b66f76" stroke-width="4" stroke-linecap="round" fill="none"/>
<path d="M470 310 q30 22 60 0" stroke="#a75f6b" stroke-width="4" stroke-linecap="round" fill="none"/>
<!-- hair cap and animated locks -->
<path d="M405 255 C380 155 445 110 510 125 C595 135 620 205 585 290 C570 235 560 190 515 175 C470 160 435 200 405 255Z" fill="url(#hair)"/>
<g class="hair-strand" fill="none" stroke="#8d5266" stroke-linecap="round">
  <path d="M430 170 C400 250 430 330 405 410" stroke-width="13"/>
  <path d="M455 155 C435 240 470 320 450 385" stroke-width="8"/>
  <path d="M570 175 C600 260 565 340 600 420" stroke-width="12"/>
  <path d="M545 155 C565 245 530 320 550 385" stroke-width="7"/>
</g>
<!-- arms and book -->
<path d="M430 410 C390 460 405 520 465 555 L495 530 C460 490 460 450 480 420Z" fill="#e5b6a1"/>
<path d="M570 410 C610 460 595 520 535 555 L505 530 C540 490 540 450 520 420Z" fill="#e5b6a1"/>
<g transform="translate(405 500) rotate(-5)">
  <path d="M0 20 Q65 0 125 22 L125 120 Q65 95 0 115Z" fill="url(#book)" stroke="#9a6d7c" stroke-width="4"/>
  <path d="M125 22 Q185 0 250 20 L250 115 Q185 95 125 120Z" fill="#fff8ec" stroke="#9a6d7c" stroke-width="4"/>
  <path d="M125 22 V120" stroke="#b78c9c" stroke-width="3"/>
  <g stroke="#c7a9b4" stroke-width="3" opacity=".7"><path d="M22 45 h78 M22 60 h70 M22 75 h82 M22 90 h64 M148 45 h78 M148 60 h70 M148 75 h82 M148 90 h64"/></g>
</g>
<g fill="#fdf5ed" opacity=".7"><circle cx="390" cy="470" r="5"/><circle cx="620" cy="500" r="4"/><circle cx="350" cy="550" r="3"/></g>
<text x="500" y="965" text-anchor="middle" font-family="Georgia,serif" font-size="24" letter-spacing="5" fill="#7e425d" opacity=".72">HER NEXT CHAPTER AWAITS</text>
</svg>